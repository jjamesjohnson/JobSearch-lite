# App settings
app_name: "JobParsrAgent"
user_id: "dev_user_01"
session_id: "session_01"

models:
  claude_sonnet: "anthropic/claude-sonnet-4-5"
  claude_haiku: "anthropic/claude-haiku-4-5"
  gemini_2.5_flash: "gemini-2.5-flash"
  gemini_2.0_flash: "gemini-2.5-flash-lite"
  gpt_4o: "github/gpt-4o"
  gpt_41: "github/gpt-4.1"
  gpt_5: "github/gpt-5"

# Agent settings
# Selectors decide per-agent models when BOTH provider keys are set; with only
# one of ANTHROPIC_API_KEY / GOOGLE_API_KEY present, every agent runs on that
# provider regardless of these selectors.
decidingParser_model: "claude_haiku"
parseBulkText_model: "claude_sonnet"
verifyJson_model: "claude_sonnet"
validateJob_model: "claude_haiku"
decidingScraper_model: "claude_haiku"

max_loop_iterations: 5
logging_level: "WARNING"